version: 2
sources:
  - name: raw
    description: "Camada bruta com os eventos recebidos dos gateways ESP32 via API de ingestão."
    database: projeto_it
    schema: it_raw
    tables:
      - name: esp32_payload
        description: "Eventos BLE capturados pelos gateways ESP32."
        columns:
          - name: ingested_at
            description: "Timestamp gerado pela API no momento da recepção do evento."
          - name: gateway_id
            description: "Identificador do gateway ESP32 que captou o sinal."
          - name: device_timestamp
            description: "Timestamp gerado pelo próprio dispositivo no momento da captura."
          - name: tag_mac
            description: "Endereço MAC da tag BLE detectada, no formato AA:BB:CC:DD:EE:FF."
          - name: found
            description: "Se a tag estava dentro do alcance (true) ou foi perdida (false)."
          - name: rssi
            description: "Intensidade do sinal BLE em dBm. Quanto mais próximo de zero, mais forte."
