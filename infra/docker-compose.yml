services:
  postgres:
    image: postgres:16
    container_name: projeto_it_postgres
    env_file:
      - ../.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U projeto_it -d projeto_it"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../services/ingestion-api
      dockerfile: Dockerfile
    container_name: projeto_it_api
    env_file:
      - ../.env
    environment:
      - POSTGRES_HOST=postgres
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  metabase:
    image: metabase/metabase:latest
    container_name: projeto_it_metabase
    ports:
      - "3000:3000"
    environment:
      - MB_DB_TYPE=postgres
      - MB_DB_DBNAME=metabase
      - MB_DB_PORT=5432
      - MB_DB_USER=projeto_it
      - MB_DB_PASS=projeto_it_pass
      - MB_DB_HOST=postgres
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
